[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "confronto-inferenza"
version = "1.0.0"
description = "Benchmark comparing OWL ontology reasoning (SPARQL/HermiT) with local LLMs served via Ollama"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "litellm==1.91.4",
    "chromadb==1.5.9",
    "sentence-transformers==5.6.1",
    "evaluate==0.4.6",
    "pandas==3.0.5",
    "rdflib==7.6.0",
    "owlready2==0.51",
    "numpy==2.5.1",
    "torch==2.13.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.6",
    "pytest==9.2.0",
]

[project.scripts]
confronto-inferenza = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
